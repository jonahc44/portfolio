<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jonah — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Jonah, a software engineer and computer science student building systems, tools and web applications."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1b1b19"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#e4e1d8"
    />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jonah — Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Jonah, a software engineer and computer science student building systems, tools and web applications."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Scheme-aware, with the dark values repeated as var() fallbacks so a
         browser that ignores prefers-color-scheme inside a favicon still gets
         exactly the icon it got before. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Esvg{--bg:%231b1b19;--fg:%23a0c516}@media(prefers-color-scheme:light){svg{--bg:%23e4e1d8;--fg:%23b73700}}%3C/style%3E%3Crect width='32' height='32' fill='var(--bg,%231b1b19)'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='var(--fg,%23a0c516)' stroke-width='2'/%3E%3Crect x='13' y='12' width='6' height='8' fill='var(--fg,%23a0c516)'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
